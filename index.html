<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mkale FX | Member Registration</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <div class="brand">
            <span class="logo">MF</span>
            <h1>Mkale FX</h1>
        </div>
        <button id="theme" class="theme-btn">Dark Mode</button>
    </header>

    <main class="container">
        <section class="card">
            <h2>Create Account</h2>
            <p class="subtitle">Register to join the Mkale FX community.</p>

            <form id="regform" novalidate>
                <div class="grid-2">
                    <div class="field">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" placeholder="e.g. Caleb Mburu">
                        <small class="error" id="nameError"></small>
                    </div>
                    <div class="field">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" placeholder="e.g. student@kyu.ac.ke">
                        <small class="error" id="emailError"></small>
                    </div>
                    <div class="field">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="Min. 6 characters">
                        <small class="error" id="passwordError"></small>
                    </div>
                    <div class="field">
                        <label for="confirm-password">Confirm Password</label>
                        <input type="password" id="confirm-password" placeholder="Re-enter password">
                        <small class="error" id="confirmError"></small>
                    </div>
                    <div class="field">
                        <label for="gender">Gender</label>
                        <select id="gender">
                            <option value="">-- Select Gender --</option>
                            <option value="male">Male</option>
                            <option value="female">Female</option>
                            <option value="other">Other</option>
                        </select>
                        <small class="error" id="genderError"></small>
                    </div>
                    <div class="field">
                        <label for="dob">Date of Birth</label>
                        <input type="date" id="dob">
                        <small class="error" id="dobError"></small>
                    </div>
                    <div class="field">
                        <label for="country">Country</label>
                        <input type="text" id="country" placeholder="e.g. Kenya">
                        <small class="error" id="countryError"></small>
                    </div>
                    <div class="field">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" placeholder="+254 7XX XXX XXX">
                        <small class="error" id="phoneError"></small>
                    </div>
                </div>

                <div class="field">
                    <label for="bio">Short Bio</label>
                    <textarea id="bio" rows="4" placeholder="A few words about yourself..."></textarea>
                    <small class="error" id="bioError"></small>
                </div>

                <button type="submit" class="submit-btn">Create Account</button>
                <p id="successMsg" class="success hidden"></p>
            </form>
        </section>

        <section class="card">
            <h2>Members (<span id="count">0</span>)</h2>
            <p class="subtitle">Newly registered members appear here.</p>
            <ul id="memberList" class="member-list">
                <li class="empty" id="emptyNote">No members yet. Be the first to register!</li>
            </ul>
        </section>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 Mkale FX · SPI 2201 Web Application Development · Kirinyaga University</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
